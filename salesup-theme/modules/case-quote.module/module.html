{% if module.quote %}
<section class="case-quote wrap">
  <figure class="quote-card">
    <span class="quote-mark" aria-hidden="true">“</span>
    <blockquote>{{ module.quote }}</blockquote>
    {% if module.who %}<figcaption><footer>{{ module.who }}</footer></figcaption>{% endif %}
  </figure>
</section>
{% endif %}
