<section class="engine" id="motor">
  <div class="wrap">
    {% if module.eyebrow %}<span class="mono">{{ module.eyebrow }}</span>{% endif %}
    <h2>{{ module.heading }}</h2>
    {% if module.sub %}<p class="engine-sub">{{ module.sub }}</p>{% endif %}
    <div class="engine-diagram">
<svg viewBox="0 0 640 640" width="100%" role="img" aria-label="De salesUp-motor: vijf diensten in één cirkel — Marketing, Sales Contact Center, Face2Face Sales, Training en Sales Consultants — rond één centrale databasis.">
          <!-- baancirkel -->
          <circle cx="320" cy="320" r="230" fill="none" stroke="#e7e7ef" stroke-width="1.5" stroke-dasharray="2 6"/>
          <!-- verbindingslijnen (pentagon) -->
          <g stroke="#e7e7ef" stroke-width="1.5">
            <line x1="320" y1="90"  x2="539" y2="249"/>
            <line x1="539" y1="249" x2="455" y2="506"/>
            <line x1="455" y1="506" x2="185" y2="506"/>
            <line x1="185" y1="506" x2="101" y2="249"/>
            <line x1="101" y1="249" x2="320" y2="90"/>
          </g>
          <!-- stromende puntjes (offset-path via CSS, reduced-motion-safe) -->
          <circle class="flow-dot" r="4.5" fill="#EF7D00"></circle>
          <circle class="flow-dot d2" r="4.5" fill="#EF7D00"></circle>
          <circle class="flow-dot d3" r="4.5" fill="#EF7D00"></circle>
          <!-- centrale label -->
          <circle cx="320" cy="320" r="74" fill="#151e35"/>
          <text x="320" y="314" text-anchor="middle" fill="#fff" font-family="Poppins, sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5">salesUp</text>
          <text x="320" y="336" text-anchor="middle" fill="#8A8F99" font-family="Poppins, sans-serif" font-size="10" letter-spacing="2">DE MOTOR</text>

          <!-- 01 Marketing (top) -->
          <g class="node-group">
            <circle class="node-circle" cx="320" cy="90" r="30" fill="#fff" stroke="#193c6c" stroke-width="1.5"/>
            <text class="node-num" x="320" y="95" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="12" fill="#193c6c">01</text>
            <text x="320" y="42" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" font-size="14" fill="#151e35">Marketing</text>
          </g>
          <!-- 02 Sales Contact Center (rechtsboven) -->
          <g class="node-group">
            <circle class="node-circle" cx="539" cy="249" r="30" fill="#fff" stroke="#193c6c" stroke-width="1.5"/>
            <text class="node-num" x="539" y="254" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="12" fill="#193c6c">02</text>
            <text x="539" y="196" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" font-size="13" fill="#151e35">Sales</text>
            <text x="539" y="211" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" font-size="13" fill="#151e35">Contact Center</text>
          </g>
          <!-- 03 Face2Face Sales (rechtsonder) -->
          <g class="node-group">
            <circle class="node-circle" cx="455" cy="506" r="30" fill="#fff" stroke="#193c6c" stroke-width="1.5"/>
            <text class="node-num" x="455" y="511" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="12" fill="#193c6c">03</text>
            <text x="455" y="560" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" font-size="13" fill="#151e35">Face2Face</text>
            <text x="455" y="575" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" font-size="13" fill="#151e35">Sales</text>
          </g>
          <!-- 04 Training (linksonder) -->
          <g class="node-group">
            <circle class="node-circle" cx="185" cy="506" r="30" fill="#fff" stroke="#193c6c" stroke-width="1.5"/>
            <text class="node-num" x="185" y="511" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="12" fill="#193c6c">04</text>
            <text x="185" y="567" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" font-size="13" fill="#151e35">Training</text>
          </g>
          <!-- 05 Sales Consultants (linksboven) -->
          <g class="node-group">
            <circle class="node-circle" cx="101" cy="249" r="30" fill="#fff" stroke="#193c6c" stroke-width="1.5"/>
            <text class="node-num" x="101" y="254" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="12" fill="#193c6c">05</text>
            <text x="101" y="196" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" font-size="13" fill="#151e35">Sales</text>
            <text x="101" y="211" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="600" font-size="13" fill="#151e35">Consultants</text>
          </g>
        </svg>
    </div>
    <ul class="engine-legend">
      {% for n in module.nodes %}
      <li><span class="idx">{{ n.idx }}</span><strong>{{ n.naam }}</strong><div>{{ n.desc }}</div></li>
      {% endfor %}
    </ul>
  </div>
</section>
