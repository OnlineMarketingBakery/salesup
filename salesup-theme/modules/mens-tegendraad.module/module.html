<section class="section wrap" id="mens" aria-labelledby="mens-titel">
  <div class="section-head">
    {% if module.eyebrow %}<span class="mono">{{ module.eyebrow }}</span>{% endif %}
    <h2 id="mens-titel">{{ module.heading }}</h2>
    {% if module.intro %}<div>{{ module.intro }}</div>{% endif %}
  </div>
  <div class="aip-mens-grid">
    <figure class="aip-media">
      <img class="img-fit-{% if module.image_fit == 'contain' %}contain{% else %}cover{% endif %}" src="{% if module.media.src %}{{ module.media.src }}{% else %}https://salesup.be/hubfs/Untitled%20design.png{% endif %}" alt="{{ module.media.alt }}" width="1600" height="1200" loading="lazy" decoding="async">
    </figure>
    <div>
      {% if module.lead %}<p class="aip-lead">{{ module.lead }}</p>{% endif %}
      <div class="aip-mens-pull">
        <strong>{{ module.pull_titel }}</strong>
        <div>{{ module.pull_body }}</div>
      </div>
    </div>
  </div>
</section>
