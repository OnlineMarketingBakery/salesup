<!--
  templateType: error_page
  isAvailableForNewContent: true
  label: salesUp — 404 Pagina niet gevonden
-->
{% extends "./base.html" %}

{% block extra_head %}
<script>
(function() {
  var path = window.location.pathname.toLowerCase().replace(/\/+$/, '');
  var redirects = {
    '/vacature-studentenjob-face2face': '/jobs-studenten',
    '/studentenjob-face2face': '/jobs-studenten',
    '/vacature/studentenjob-face2face': '/jobs-studenten',
    '/vacatures/studentenjob-face2face': '/jobs-studenten',
    '/vacature-contact-center': '/jobs-contact-center',
    '/vacature-sales-consultants': '/jobs-sales-consultants',
    '/client-cases': '/cases',
    '/client-cases/liantis': '/cases/liantis',
    '/client-cases/orange': '/cases/orange',
    '/client-cases/zambon': '/cases/zambon',
    '/client-cases/astara': '/cases/astara',
    '/client-cases/trustteam': '/cases/trustteam',
    '/client-cases/q8oils': '/cases/q8oils'
  };

  if (redirects[path]) {
    window.location.replace(redirects[path]);
  } else if (path.indexOf('/client-cases') === 0) {
    window.location.replace('/cases');
  }
})();
</script>
{% endblock %}

{% block content %}
<section class="hero wrap" style="padding: 100px 24px 120px; text-align: center; display: flex; flex-direction: column; align-items: center;">
  <span class="eyebrow mono" style="margin-bottom: 16px;">Error 404</span>
  <h1 style="max-width: 20ch; margin: 0 auto 16px;">Pagina niet <em>gevonden</em>.</h1>
  <div class="hero-sub" style="max-width: 48ch; margin: 0 auto 32px;">
    <p>Helaas konden we niets vinden onder de opgegeven URL. Mogelijk is de pagina verplaatst of bestaat ze niet meer.</p>
  </div>
  <div class="hero-cta" style="justify-content: center; gap: 14px;">
    <a class="btn" href="/">Terug naar startpagina <span class="arrow" aria-hidden="true">&rarr;</span></a>
    <a class="btn ghost" href="/contact">Contacteer ons</a>
  </div>
</section>
{% endblock %}
